version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: false
  go: "1.26"

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - errcheck
    - exhaustive
    - forbidigo
    - gocritic
    - goprintffuncname
    - govet
    - ineffassign
    - makezero
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    staticcheck:
      # Preserve the v1 checks without enabling the new Quick Fix suggestions.
      checks:
        - all
        - -QF*
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    forbidigo:
      # Prefer github.com/pkg/errors over fmt.Errorf.
      forbid:
        - pattern: ^fmt\.Errorf$
  exclusions:
    generated: lax
    rules:
      # Preserve the existing gif plugin package name.
      - path: ^plugin/gif/
        linters:
          - revive
        text: 'var-naming: avoid package names that conflict with Go standard library package names'
      - path: (.+)\.go$
        text: Error return value of .((os.)?std(out|err)..*|.*Close|.*Seek|.*Flush|os.Remove(All)?|.*print(f|ln)?|os.(Un)?Setenv). is not check
      - path: (.+)\.go$
        text: 'identifier ".*" contain non-ASCII character: U\+.*'
    paths:
      - ^data(/|$)
      - third_party$
      - builtin$
      - examples$

issues:
  uniq-by-line: true
  fix: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/FloatTech/ZeroBot-Plugin
  exclusions:
    generated: lax
    paths:
      - ^data(/|$)
      - third_party$
      - builtin$
      - examples$
